[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glassbox-agent"
version = "0.1.0"
description = "A transparent, replayable minimal Agent runtime built without Agent frameworks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "GlassBox Agent Candidate" }]
dependencies = [
  "openai>=1.58.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.1",
  "rich>=13.9.0",
  "tenacity>=9.0.0",
  "typer>=0.15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
]

[project.scripts]
glassbox = "glassbox.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["glassbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["live: calls the real DeepSeek API"]

[tool.coverage.run]
branch = true
source = ["glassbox"]
omit = ["glassbox/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  '\.\.\.',
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
